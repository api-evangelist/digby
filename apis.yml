name: Digby
description: 'Digby was an Austin, Texas software-as-a-service provider of mobile commerce
  and mobile engagement solutions for large retailers, operating under parent company
  30 Second Software Inc. Its platform — including the Localpoint location-based marketing
  product — delivered branded mobile web experiences and native shopping apps, connecting
  digital engagement to physical stores for customers such as Cabela''s, Kohl''s, Catalina
  Marketing and Hasbro. Digby raised venture funding from Battery Ventures, S3 Ventures,
  Daylight Ventures, Relay Ventures and the BlackBerry Partners Fund. The company was
  acquired by fellow Austin mobile company Phunware in May 2014 (along with its Movaya
  subsidiary in Seattle and Chengdu), terms undisclosed, and the Localpoint technology
  was folded into Phunware''s product line. Digby no longer operates as an independent
  company: digby.com no longer resolves to a live site (last Internet Archive capture
  February 2015) and there is no current developer portal, documentation, API, SDK
  or other public API surface to catalog.'
